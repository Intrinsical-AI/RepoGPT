repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (uv.lock)
        entry: uv run --locked --extra dev ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check (uv.lock)
        entry: uv run --locked --extra dev ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy (uv.lock)
        entry: uv run --locked --extra dev mypy src tests
        language: system
        pass_filenames: false
        always_run: true
