[project]
name               = "repogpt"
version            = "0.12.1"
description        = "A consultable abstraction layer over any codebase: structured summaries and code intelligence for humans and LLM/RAG systems."
readme             = "README.md"
requires-python    = ">=3.10"
keywords           = ["code-analysis", "LLM-integration", "RAG", "code-intelligence", "repo-gpt"]
license            = "MIT"
license-files      = ["LICENSE"]

authors = [
  { name = "Intrinsical-AI", email = "p.p.cabezon@proton.me" },
]
maintainers = [
  { name = "Intrinsical-AI", email = "p.p.cabezon@proton.me" },
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent"
]

dependencies = [
  "pathspec>=0.12.1",    # .repogptignore support
  "structlog>=24.1.0",   # structured logging
]

[project.optional-dependencies]
mcp = ["mcp==1.30.0", "certifi>=2026.10.19", "PyJWT>=2.15.0", "cryptography>=50.0.0", "pydantic-settings>=2.14.2", "anyio==4.14.2", "jsonschema>=4.0"]

[dependency-groups]
dev = [
  "pytest>=7.0", 
  "ruff>=0.0.291", 
  "mypy>=1.0",
  "jsonschema>=4.0"
]

hooks = ["pre-commit>=2.20", "filelock>=4.2.1", "virtualenv>=21.14.13"]

[tool.uv.dependency-groups]
hooks = { requires-python = ">=3.11" }

[project.urls]
"Homepage"      = "https://github.com/Intrinsical-AI/RepoGPT"
"Repository"    = "https://github.com/Intrinsical-AI/RepoGPT"
"Bug Tracker"   = "https://github.com/Intrinsical-AI/RepoGPT/issues"
"Documentation" = "https://github.com/Intrinsical-AI/RepoGPT#readme"

[project.scripts]
repogpt = "repogpt.app.cli:main"
repogpt-mcp = "repogpt.app.mcp_cli:main"

[build-system]
requires    = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir   = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repogpt = ["py.typed", "schemas/*.json"]


[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/data", "tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = ["src"]
ignore_missing_imports = true
exclude = ["tests/data/", "tests/fixtures/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ"]
